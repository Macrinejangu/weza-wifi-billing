name: Foundation checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e './backend[dev]'
      - name: Start PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --wait db
      - name: Migrate and test
        working-directory: backend
        run: |
          set -a
          . ../.env
          set +a
          export TEST_DATABASE_URL="$DATABASE_URL"
          python -m alembic upgrade head
          python -m pytest
